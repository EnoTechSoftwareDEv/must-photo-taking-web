<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gallery - StudentPhoto</title>

<link rel="stylesheet"
      href="style.css">

</head>


<body>


<div class="system-layout">


<aside class="sidebar">

<a href="index.html"
   class="sidebar-logo">

📸 Student<span>Photo</span>

</a>


<div class="admin-profile">

<div class="admin-avatar">
A
</div>

<div>

<strong>
Administrator
</strong>

<small>
System Admin
</small>

</div>

</div>


<nav class="sidebar-nav">

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="students.html">
👨‍🎓 Students
</a>

<a href="photographers.html">
📷 Photographers
</a>

<a href="bookings.html">
📅 Bookings
</a>

<a href="gallery.html"
   class="active">

🖼️ Gallery

</a>

</nav>


<a href="index.html"
   class="logout"
   onclick="return confirmLogout()">

↪ Logout

</a>

</aside>



<main class="main-content">


<div class="mobile-header">

<button onclick="toggleSidebar()">
☰
</button>

<strong>
StudentPhoto
</strong>

</div>


<div class="page-header">

<div>

<span class="badge">
PHOTO MANAGEMENT
</span>

<h1>
Photo Gallery
</h1>

<p>
Upload and organize student photos.
</p>

</div>

</div>



<section class="panel">


<div class="panel-heading">

<h2>
Upload Student Photo
</h2>

</div>


<form id="photoForm"
      class="form-grid">


<div class="form-group">

<label>
Student
</label>

<select id="photoStudent"
        required>

<option value="">
Select Student
</option>

</select>

</div>



<div class="form-group">

<label>
Photo Title
</label>

<input
type="text"
id="photoTitle"
placeholder="Example: Graduation Photo"
required>

</div>



<div class="form-group">

<label>
Choose Photo
</label>

<input
type="file"
id="photoFile"
accept="image/*"
required>

</div>



<div class="form-group">

<button class="btn"
        type="submit">

Upload Photo

</button>

</div>


</form>


<p class="form-note">

Photos uploaded here are stored in your browser
using localStorage.

</p>


</section>



<section>

<div class="gallery-grid"
     id="galleryGrid">

</div>

</section>


</main>

</div>


<script src="script.js"></script>

</body>

</html>
